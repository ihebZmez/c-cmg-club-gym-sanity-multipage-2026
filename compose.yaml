services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: t-gym-multipage:latest
    ports:
      - "${APP_PORT:-8080}:80"
    init: true
    restart: unless-stopped
    mem_limit: 128m
    cpus: "0.50"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet http://127.0.0.1/health || exit 1"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"